name: Build & Release Firmware

on:
  push:
    branches:
      - trunk

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Next Version
        id: semver
        uses: paulhatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"
          major_pattern: "(MAJOR)"
          minor_pattern: "feat:"
          patch_pattern: "fix:"
          version_format: "${major}.${minor}.${patch}"

      - name: Build per-board firmware ZIPs (generic/ + board dir, board wins)
        run: |
          TAG=${{ steps.semver.outputs.version }}
          for BOARD in ESP32-S3-PhotoPainter XIAO-EE04-7in3 XIAO-EE04-13in3; do
            mkdir -p "dist/$BOARD"
            cp generic/*.py "dist/$BOARD/"
            cp "$BOARD"/*.py "dist/$BOARD/"
            cp "$BOARD"/*.bin "dist/$BOARD/" 2>/dev/null || true
            # Flat zip layout: device update.py extracts to its storage root
            # and syncs top-level files by name (no directory prefix).
            (cd "dist/$BOARD" && zip -r "../$BOARD-$TAG.zip" .)
            (cd "dist/$BOARD" && zip -r "../$BOARD.zip" .)
          done

      - name: Generate Changelog
        id: changelog
        run: |
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          git log $(git describe --tags --abbrev=0 2>/dev/null || echo "")..HEAD --oneline --pretty=format:"* %s (%h)" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.semver.outputs.version }}
          name: v${{ steps.semver.outputs.version }}
          body: |
            ## Changelog
            ${{ env.CHANGELOG }}
          files: |
            dist/ESP32-S3-PhotoPainter-*.zip
            dist/ESP32-S3-PhotoPainter.zip
            dist/XIAO-EE04-7in3-*.zip
            dist/XIAO-EE04-7in3.zip
            dist/XIAO-EE04-13in3-*.zip
            dist/XIAO-EE04-13in3.zip
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Force update latest tag
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push -f origin latest

      - name: Update Latest Release Tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Firmware
          body: |
            Latest built release from trunk branch.
            Version: v${{ steps.semver.outputs.version }}
          files: |
            dist/ESP32-S3-PhotoPainter.zip
            dist/XIAO-EE04-7in3.zip
            dist/XIAO-EE04-13in3.zip
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
