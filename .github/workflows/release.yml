name: Build & Release Firmware

on:
  push:
    branches:
      - trunk

permissions:
  contents: write

jobs:
  build-c-firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build PhotoPainter C Firmware
        run: |
          . /opt/esp/entrypoint.sh
          cd ESP32-S3-PhotoPainter/c-firmware
          idf.py set-target esp32s3
          idf.py build

      - name: Merge Binaries
        run: |
          . /opt/esp/entrypoint.sh
          cd ESP32-S3-PhotoPainter/c-firmware
          esptool.py --chip esp32s3 merge_bin \
            -o build/picframe_photopainter_merged.bin \
            --flash_mode dio --flash_size 16MB --flash_freq 80m \
            0x0 build/bootloader/bootloader.bin \
            0x8000 build/partition_table/partition-table.bin \
            0x10000 build/picframe_photopainter.bin

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: c-firmware-binaries
          path: |
            ESP32-S3-PhotoPainter/c-firmware/build/bootloader/bootloader.bin
            ESP32-S3-PhotoPainter/c-firmware/build/partition_table/partition-table.bin
            ESP32-S3-PhotoPainter/c-firmware/build/picframe_photopainter.bin
            ESP32-S3-PhotoPainter/c-firmware/build/picframe_photopainter_merged.bin

  release:
    runs-on: ubuntu-latest
    needs: build-c-firmware
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download C Firmware Artifacts
        uses: actions/download-artifact@v4
        with:
          name: c-firmware-binaries
          path: dist-c/

      - name: Get Next Version
        id: semver
        uses: paulhatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"
          major_pattern: "(MAJOR)"
          minor_pattern: "feat:"
          patch_pattern: "fix:"
          version_format: "${major}.${minor}.${patch}"

      - name: Build per-board firmware ZIPs (generic/ + board dir, board wins)
        run: |
          TAG=${{ steps.semver.outputs.version }}
          # Create python packages (legacy)
          for BOARD in ESP32-S3-PhotoPainter XIAO-EE04-7in3 XIAO-EE04-13in3; do
            mkdir -p "dist/$BOARD"
            cp generic/*.py "dist/$BOARD/"
            cp "$BOARD"/*.py "dist/$BOARD/"
            cp "$BOARD"/*.bin "dist/$BOARD/" 2>/dev/null || true
            (cd "dist/$BOARD" && zip -r "../$BOARD-$TAG.zip" .)
            (cd "dist/$BOARD" && zip -r "../$BOARD.zip" .)
          done
          
          # Copy C firmware binaries to dist
          cp dist-c/picframe_photopainter_merged.bin dist/Waveshare-PhotoPainter-7in3-C-merged.bin
          cp dist-c/picframe_photopainter.bin dist/Waveshare-PhotoPainter-7in3-C.bin
          (cd dist-c && zip -r "../dist/Waveshare-PhotoPainter-7in3-C-Firmware-$TAG.zip" .)
          (cd dist-c && zip -r "../dist/Waveshare-PhotoPainter-7in3-C-Firmware.zip" .)

      - name: Generate Changelog
        id: changelog
        run: |
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          git log $(git describe --tags --abbrev=0 2>/dev/null || echo "")..HEAD --oneline --pretty=format:"* %s (%h)" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.semver.outputs.version }}
          name: v${{ steps.semver.outputs.version }}
          body: |
            ## Changelog
            ${{ env.CHANGELOG }}
          files: |
            dist/ESP32-S3-PhotoPainter-*.zip
            dist/ESP32-S3-PhotoPainter.zip
            dist/XIAO-EE04-7in3-*.zip
            dist/XIAO-EE04-7in3.zip
            dist/XIAO-EE04-13in3-*.zip
            dist/XIAO-EE04-13in3.zip
            dist/Waveshare-PhotoPainter-7in3-C-*.bin
            dist/Waveshare-PhotoPainter-7in3-C-*.zip
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Force update latest tag
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push -f origin latest

      - name: Update Latest Release Tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Firmware
          body: |
            Latest built release from trunk branch.
            Version: v${{ steps.semver.outputs.version }}
          files: |
            dist/ESP32-S3-PhotoPainter.zip
            dist/XIAO-EE04-7in3.zip
            dist/XIAO-EE04-13in3.zip
            dist/Waveshare-PhotoPainter-7in3-C-merged.bin
            dist/Waveshare-PhotoPainter-7in3-C-Firmware.zip
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
